<!DOCTYPE html>
<html>
<head>
    <title>AI Network Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        input {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h2>AI Network Attack Detector</h2>

<!-- Manual input -->
<input id="flow_duration" placeholder="Flow Duration"><br>
<input id="packet_count" placeholder="Packet Count"><br>
<input id="iat_mean" placeholder="IAT Mean"><br>
<input id="iat_std" placeholder="IAT Std"><br>

<button onclick="predict()">Analyze</button>

<br><br>

<!-- CSV upload -->
<input type="file" id="fileInput">
<button onclick="uploadCSV()">Upload CSV</button>

<div class="result" id="result"></div>

<canvas id="chart"></canvas>

<script>

function predict() {

    let f = parseFloat(flow_duration.value);
    let p = parseFloat(packet_count.value);
    let m = parseFloat(iat_mean.value);
    let s = parseFloat(iat_std.value);

    if (isNaN(f) || isNaN(p) || isNaN(m) || isNaN(s)) {
        alert("Enter valid numbers");
        return;
    }

    fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            flow_duration: f,
            packet_count: p,
            iat_mean: m,
            iat_std: s
        })
    })
    .then(res => res.json())
    .then(data => {

        let color = data.prediction === "BENIGN" ? "lightgreen" : "red";

        result.innerHTML =
            `<span style="color:${color}; font-size:20px;">
            Prediction: ${data.prediction}
            </span><br>
            Confidence: ${data.confidence}<br>
            Explanation: ${data.explanation}<br>
            Suggestion: ${data.suggestion}`;
    });
}

function uploadCSV() {
    let file = document.getElementById("fileInput").files[0];

    let formData = new FormData();
    formData.append("file", file);

    fetch("http://127.0.0.1:5000/predict_csv", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {

        result.innerHTML =
            "Total flows: " + data.total_flows + "<br>" +
            JSON.stringify(data.summary);

        showChart(data.summary);
    });
}

function showChart(summary) {
    new Chart(document.getElementById("chart"), {
        type: "pie",
        data: {
            labels: Object.keys(summary),
            datasets: [{
                data: Object.values(summary)
            }]
        }
    });
}

</script>

</body>
</html>
